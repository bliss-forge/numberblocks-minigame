<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#79d8ff">
  <meta name="color-scheme" content="light">
  <title>숫자블록 놀이터</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=20260808-delivery">
  <link rel="stylesheet" href="mobile-games.css?v=20260808-delivery-home">
</head>
<body data-state="home" data-mode="">
  <div class="world" aria-hidden="true">
    <div class="sun">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>
    <div class="cloud cloud-c"></div>
    <div class="hill hill-far"></div>
    <div class="hill hill-near"></div>
    <div class="grass-ribbon"></div>
    <div class="flower flower-a"></div>
    <div class="flower flower-b"></div>
    <div class="flower flower-c"></div>
  </div>

  <header class="hud" aria-label="게임 도구">
    <button id="home-btn" class="round-control home-control" type="button" aria-label="처음 화면으로">
      <span class="home-roof" aria-hidden="true"></span>
      <span class="control-text">처음</span>
    </button>
    <div class="star-pill" aria-live="polite" aria-label="모은 별">
      <span aria-hidden="true">★</span>
      <span id="star-count">0</span>
    </div>
    <button id="mute-btn" class="round-control mute-control" type="button" aria-label="소리 끄기" aria-pressed="false">
      <span id="mute-icon" class="sound-mark" aria-hidden="true">♪</span>
      <span class="control-text">소리</span>
    </button>
  </header>

  <main>
    <section id="home" class="screen active" aria-labelledby="home-title">
      <div class="home-heading">
        <p class="eyebrow">숫자 친구들과 만나는 즐거운 놀이터</p>
        <h1 id="home-title" class="logo" aria-label="숫자블록 놀이터">
          <span class="logo-number">숫자</span><span class="logo-block">블록</span>
          <em>놀이터</em>
        </h1>
      </div>

      <div id="difficulty-picker" class="difficulty-picker" role="group" aria-label="난이도 선택">
        <span class="difficulty-label">난이도</span>
        <button class="difficulty-button" type="button" data-difficulty="easy">
          쉬움
        </button>
        <button class="difficulty-button" type="button" data-difficulty="steady">
          차근차근
        </button>
        <button class="difficulty-button" type="button" data-difficulty="challenge">
          도전
        </button>
      </div>

      <div class="mode-grid" aria-label="놀이 선택">
        <button class="mode-card" type="button" data-mode="count">
          <span class="card-number">1</span>
          <img src="assets/characters/one.png" alt="" srcset="assets/characters/thumb/one.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>몇 개일까?</strong>
            <small>보고 세어 봐요</small>
          </span>
          <span id="count-unavailable" class="mode-unavailable" hidden>
            도전에서는 더하기, 빼기와 곱하기를 해요
          </span>
        </button>
        <button class="mode-card" type="button" data-mode="add">
          <span class="card-number">2</span>
          <img src="assets/characters/two.png" alt="" srcset="assets/characters/thumb/two.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>더하기 합체</strong>
            <small>친구들을 모아요</small>
          </span>
        </button>
        <button class="mode-card" type="button" data-mode="sub">
          <span class="card-number">3</span>
          <img src="assets/characters/three.png" alt="" srcset="assets/characters/thumb/three.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>빼기 블록</strong>
            <small>친구를 빼어 봐요</small>
          </span>
        </button>
        <button class="mode-card" type="button" data-mode="mul">
          <span class="card-number">4</span>
          <img src="assets/characters/four.png" alt="" srcset="assets/characters/thumb/four.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>곱하기 블록</strong>
            <small>줄과 칸을 세어요</small>
          </span>
        </button>
        <button class="mode-card safety-mode-card" type="button" data-mode="safety">
          <span class="card-number">5</span>
          <img src="assets/characters/five.png" alt="" srcset="assets/characters/thumb/five.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>안전한 길찾기</strong>
            <small>친구들을 만나러 가요</small>
          </span>
        </button>
        <button class="mode-card subway-mode-card" type="button" data-mode="subway">
          <span class="card-number">6</span>
          <img src="assets/characters/six.png" alt="" srcset="assets/characters/thumb/six.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>지하철 여행</strong>
            <small>갈아타고 목적지까지 가요</small>
          </span>
        </button>
        <button class="mode-card ktx-mode-card" type="button" data-mode="ktx">
          <span class="card-number">7</span>
          <img src="assets/characters/seven.png" alt="" srcset="assets/characters/thumb/seven.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>칙칙폭폭 기관사</strong>
            <small>직접 몰고 부산까지</small>
          </span>
        </button>
        <button class="mode-card paint-mode-card" type="button" data-mode="paint">
          <span class="card-number">8</span>
          <img src="assets/characters/eight.png" alt="" srcset="assets/characters/thumb/eight.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>알록달록 물감 놀이</strong>
            <small>색을 섞어 그림을 칠해요</small>
          </span>
        </button>
        <button class="mode-card delivery-mode-card" type="button" data-mode="delivery">
          <span class="card-number">9</span>
          <img src="assets/characters/nine.png" alt="" srcset="assets/characters/thumb/nine.webp 480w" sizes="154px" decoding="async">
          <span class="card-copy">
            <strong>택배 왔어요!</strong>
            <small>택배차를 몰고 문 앞까지 가요</small>
          </span>
        </button>
      </div>

    </section>

    <section id="game" class="screen" tabindex="-1" aria-labelledby="problem-text" aria-hidden="true">
      <div class="stage-curtain curtain-left" aria-hidden="true"></div>
      <div class="stage-curtain curtain-right" aria-hidden="true"></div>
      <p id="problem-text" class="problem-pill"></p>
      <div class="stage-frame">
        <div class="stage-lights" aria-hidden="true"></div>
        <div id="stage" class="stage" aria-live="polite"></div>
        <div class="stage-floor" aria-hidden="true"></div>
      </div>
      <div class="answer-dock" aria-label="내 답">
        <span class="equals" aria-hidden="true">=</span>
        <div id="answer-box" class="answer-box" aria-live="assertive">?</div>
      </div>
      <div id="number-pad" class="number-pad" aria-label="숫자 입력">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button id="number-pad-delete" type="button" aria-label="마지막 숫자 지우기">⌫</button>
        <button type="button" data-digit="0">0</button>
      </div>
      <p class="game-keyboard-note">숫자키 또는 화면 숫자판으로 답해요 · <kbd>Esc</kbd> 처음으로</p>
    </section>
  </main>

  <div id="hint-msg" class="toast" role="status" aria-live="polite"></div>
  <div id="big-cheer" class="cheer" aria-hidden="true"></div>
  <footer class="creator-credit">crafted by <strong>bliss</strong> © 2026</footer>
  <script type="module" src="src/app.mjs"></script>
</body>
</html>
